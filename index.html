<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1학년 1반 상담 신청</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
    <link rel="stylesheet" href="styles.css?v=20260720-unified-design">

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
</head>
<body>
    <div id="loading" class="loading-overlay" role="status" aria-live="polite">
        <div class="loading-icon" aria-hidden="true">🌿</div>
        <div class="loading-title">달력 데이터를 불러오는 중입니다...</div>
        <div class="loading-description">(최초 접속 시 2~3초 정도 소요될 수 있습니다)</div>
    </div>

    <main class="student-page">
        <header class="service-header">
            <span class="service-eyebrow">1학년 1반 · 상담실</span>
            <h1><span aria-hidden="true">🌿</span> 1학년 1반 상담 신청 <a class="admin-leaf-link" href="./admin.html?reauth=1" aria-label="관리자 페이지">🌿</a></h1>
            <p>편한 날짜와 시간을 골라 상담을 신청해 주세요.</p>
        </header>
        <section class="calendar-card" aria-label="상담 예약 달력">
            <div id="calendar"></div>
            <div class="calendar-legend" aria-label="달력 상태 안내">
                <span><i class="legend-dot available" aria-hidden="true"></i>상담 가능</span>
                <span><i class="legend-dot vacation" aria-hidden="true"></i>방학</span>
                <span><i class="legend-dot completed" aria-hidden="true">✓</i>상담 완료</span>
                <span><i class="legend-dot blocked" aria-hidden="true"></i>상담 불가</span>
            </div>
        </section>
    </main>

    <div id="modal-backdrop" class="modal-backdrop hidden" aria-hidden="true">
        <section id="booking-modal" class="modal-panel hidden" role="dialog" aria-modal="true" aria-labelledby="booking-title" aria-describedby="booking-description">
            <button type="button" class="modal-close" data-close-modal aria-label="예약 창 닫기">×</button>
            <h3 id="booking-title" class="modal-title">상담 예약 신청</h3>
            <p id="booking-description" class="modal-description">날짜와 시간을 확인하고 신청 정보를 입력해 주세요.</p>
            <form id="booking-form" novalidate>
                <div class="form-group">
                    <span class="form-label">선택 날짜</span>
                    <div id="booking-date-display" class="selected-date"></div>
                </div>
                <fieldset class="form-group form-fieldset">
                    <legend class="form-label">상담 시간</legend>
                    <div id="booking-slot-list" class="slot-list"></div>
                </fieldset>
                <div class="form-group">
                    <label class="form-label" for="booking-name">이름</label>
                    <input id="booking-name" class="form-input" type="text" autocomplete="name" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="booking-password">비밀번호</label>
                    <input id="booking-password" class="form-input" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" autocomplete="new-password" aria-describedby="booking-password-help" required>
                    <p id="booking-password-help" class="form-help">예약 취소 시 사용할 숫자 4자리를 입력해 주세요.</p>
                </div>
                <p id="booking-message" class="form-message hidden" role="alert"></p>
                <div class="modal-actions">
                    <button type="button" class="modal-button button-secondary" data-close-modal>취소</button>
                    <button id="booking-submit" type="submit" class="modal-button button-primary">예약 신청</button>
                </div>
            </form>
        </section>

        <section id="cancel-modal" class="modal-panel hidden" role="dialog" aria-modal="true" aria-labelledby="cancel-title" aria-describedby="cancel-description">
            <button type="button" class="modal-close" data-close-modal aria-label="취소 창 닫기">×</button>
            <h3 id="cancel-title" class="modal-title">상담 예약 취소</h3>
            <p id="cancel-description" class="modal-description"></p>
            <form id="cancel-form" novalidate>
                <div class="form-group">
                    <label class="form-label" for="cancel-password">비밀번호</label>
                    <input id="cancel-password" class="form-input" type="password" inputmode="numeric" autocomplete="current-password" aria-describedby="cancel-password-help" required>
                    <p id="cancel-password-help" class="form-help">예약 시 설정한 숫자 4자리 또는 관리자 비밀번호를 입력해 주세요.</p>
                </div>
                <p id="cancel-message" class="form-message hidden" role="alert"></p>
                <div class="modal-actions">
                    <button type="button" class="modal-button button-secondary" data-close-modal>돌아가기</button>
                    <button id="cancel-submit" type="submit" class="modal-button button-danger">예약 취소</button>
                </div>
            </form>
        </section>

        <section id="notice-modal" class="modal-panel hidden" role="alertdialog" aria-modal="true" aria-labelledby="notice-title" aria-describedby="notice-message">
            <button type="button" class="modal-close" data-close-modal aria-label="안내 창 닫기">×</button>
            <h3 id="notice-title" class="modal-title">안내</h3>
            <p id="notice-message" class="modal-description"></p>
            <div class="modal-actions">
                <button id="notice-confirm" type="button" class="modal-button button-primary">확인</button>
            </div>
        </section>

    </div>

    <script src="script.js?v=20260720-unified-design"></script>
</body>
</html>
